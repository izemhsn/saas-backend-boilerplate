# CI pipeline — runs on every push to main/dev and on pull requests.
#
#   verify (lint + test, from verify.yml) ──► build
#
# verify — ESLint + Prettier + the Vitest suite against PostgreSQL + Redis.
#          Defined in the reusable verify.yml so that deploy.yml can run the
#          exact same checks before publishing an image.
# build  — Docker production image build + /health smoke test (confirms the
#          Dockerfile is valid and the server actually boots).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel in-flight runs for the same ref when a new commit is pushed — saves
# runner minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          tags: saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test the image
        run: |
          # Start a Redis container on a custom network so the app can reach it
          # by hostname. In production mode the rate limiters use a Redis store,
          # so Redis must be reachable for /health to respond promptly.
          docker network create smoke-net
          docker run -d --name smoke-redis --network smoke-net redis:7-alpine

          # Start the app container with env vars that pass the production boot
          # validation (32+ char JWT secrets + CORS_ORIGIN). The /health
          # endpoint doesn't touch the DB, so a dummy DATABASE_URL is fine.
          # REDIS_URL points at the sibling Redis container.
          docker run -d --name smoke -p 3001:3000 --network smoke-net \
            -e DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" \
            -e REDIS_URL="redis://smoke-redis:6379" \
            -e JWT_SECRET="ci-smoke-test-jwt-secret-at-least-32-chars" \
            -e JWT_REFRESH_SECRET="ci-smoke-test-jwt-refresh-secret-32-chars" \
            -e CORS_ORIGIN="http://localhost:3000" \
            saas-backend:ci

          # Wait for the server to start (or fail within 15s — allow time for
          # the Redis connection to establish before the first request).
          # Written as if/else rather than `A && B || C`: with the latter, a
          # failing echo would fall through to the failure branch.
          if timeout 15 bash -c 'until curl -sf http://localhost:3001/health > /dev/null 2>&1; do sleep 0.5; done'; then
            echo "Smoke test passed — server responds on /health"
          else
            echo "Smoke test failed — server did not start"
            docker logs smoke
            exit 1
          fi

          docker stop smoke smoke-redis || true
          docker rm smoke smoke-redis || true
          docker network rm smoke-net || true
