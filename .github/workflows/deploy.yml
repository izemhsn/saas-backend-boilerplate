# CD pipeline — builds and publishes the Docker image to GitHub Container
# Registry (GHCR) when code lands on `main` or a version tag is pushed.
#
#   verify ──► build-and-push ──► migrate ──► deploy
#
# Nothing is published until lint and the full test suite pass: `build-and-push`
# depends on the same reusable verify.yml that CI runs, so a red commit cannot
# reach GHCR. Migrations are applied after the image exists but *before* the
# deploy step promotes it, so new code never serves traffic against a schema
# that has not caught up.
#
# The image is tagged with:
#   - `latest`          — always, on every push to main
#   - `sha-<git-sha>`   — the full commit SHA (immutable, traceable)
#   - `<tag>`           — the git tag name (e.g. v1.2.3) when a tag is pushed
#
# To deploy to your own infrastructure (Fly.io, Railway, Render, AWS, etc.),
# add a deploy step after the image is pushed. See the README for guidance.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

# Don't run deploy concurrently with itself for the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Allow the workflow to push to GHCR and create a deployment environment.
permissions:
  contents: read
  packages: write

jobs:
  # Same lint + test suite CI runs. This is the gate: without it, a push to
  # main publishes an image regardless of whether the tests pass.
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags + labels from the git ref (branch or tag).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} (digest ${{ steps.push.outputs.digest }})"

  # ---------------------------------------------------------------------------
  # Apply pending migrations to the production database.
  #
  # This runs *before* the deploy job so the schema is never behind the code
  # that is about to serve traffic — the classic cause of 500s immediately
  # after a release. `prisma migrate deploy` only applies committed migrations
  # and never generates or resets anything, which is why it (and not
  # `migrate dev`) is the production command.
  #
  # Requires a `DATABASE_URL` secret on the `production` environment. Until you
  # set one this job logs a warning and succeeds, so a fresh fork's first
  # deploy is not blocked — set the secret before you rely on this pipeline.
  #
  # Note this applies migrations against the live database while the previous
  # image is still serving. Keep migrations backward-compatible with the
  # running version (expand/contract: add columns before you stop writing the
  # old ones, drop them in a later release).
  # ---------------------------------------------------------------------------
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Migrations skipped::DATABASE_URL is not set on the 'production' environment. Add it in Settings → Environments → production → Secrets to enable this step."
            exit 0
          fi
          npx prisma migrate deploy

  # ---------------------------------------------------------------------------
  # Deploy step — placeholder.
  #
  # This job runs after the image is pushed to GHCR and migrations have been
  # applied. Uncomment and adapt it for your hosting platform. Examples:
  #
  # Fly.io:    fly deploy --image ghcr.io/${{ github.repository }}:sha-<sha>
  # Railway:   railway up (uses the Railway GitHub integration instead)
  # Render:    trigger a deploy via the Render API
  # Kubernetes: kubectl set image deployment/saas-backend ...
  # SSH + VPS:  ssh server "docker pull ghcr.io/... && docker compose up -d"
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy placeholder
        run: |
          echo "Docker image published to GHCR:"
          echo "  ${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "Add your deploy step here — see .github/workflows/deploy.yml comments."
