# CD pipeline — builds and publishes the Docker image to GitHub Container
# Registry (GHCR) when code lands on `main` or a version tag is pushed.
#
# The image is tagged with:
#   - `latest`          — always, on every push to main
#   - `sha-<git-sha>`   — the full commit SHA (immutable, traceable)
#   - `<tag>`           — the git tag name (e.g. v1.2.3) when a tag is pushed
#
# To deploy to your own infrastructure (Fly.io, Railway, Render, AWS, etc.),
# add a deploy step after the image is pushed. See the README for guidance.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

# Don't run deploy concurrently with itself for the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Allow the workflow to push to GHCR and create a deployment environment.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags + labels from the git ref (branch or tag).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} (digest ${{ steps.push.outputs.digest }})"

  # ---------------------------------------------------------------------------
  # Deploy step — placeholder.
  #
  # This job runs after the image is pushed to GHCR. Uncomment and adapt it
  # for your hosting platform. Examples:
  #
  # Fly.io:    fly deploy --image ghcr.io/${{ github.repository }}:sha-<sha>
  # Railway:   railway up (uses the Railway GitHub integration instead)
  # Render:    trigger a deploy via the Render API
  # Kubernetes: kubectl set image deployment/saas-backend ...
  # SSH + VPS:  ssh server "docker pull ghcr.io/... && docker compose up -d"
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy placeholder
        run: |
          echo "Docker image published to GHCR:"
          echo "  ${{ needs.build-and-push.outputs.image }}"
          echo ""
          echo "Add your deploy step here — see .github/workflows/deploy.yml comments."
